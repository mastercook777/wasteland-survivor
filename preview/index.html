<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#11130f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wasteland Survivor" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Wasteland Survivor — Art Reforge Preview</title>
</head>
<body>
  <main id="app">
    <div id="game-shell">
      <canvas id="game" width="540" height="960" aria-label="Wasteland Survivor portrait game canvas"></canvas>
    </div>
    <div id="landscape-note">PORTRAIT MODE RECOMMENDED</div>
  </main>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', async () => {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(r => r.scope.includes('/wasteland-survivor/preview/')).map(r => r.unregister()));
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.includes('wasteland-survivor-art-reforge-preview')).map(k => caches.delete(k)));
          }
        } catch (_) {}
      });
    }
  </script>
</body>
</html>
